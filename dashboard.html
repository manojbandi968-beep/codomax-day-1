<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Inkwell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="site-nav">
    <div class="container">
      <a href="index.html" class="brand">Ink<span>well</span></a>
      <ul class="nav-links" id="nav-auth-slot"></ul>
    </div>
  </nav>

  <main class="container">
    <div class="dash-header">
      <div>
        <h1 id="dash-title">Your posts</h1>
        <p id="dash-sub"></p>
      </div>
      <a href="create-blog.html" class="btn">Write a new post</a>
    </div>

    <div id="dash-post-list">
      <!-- filled by script below -->
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">Inkwell — a frontend development project.</div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    const user = requireAuth();

    async function renderDashboard() {
      if (!user) return;
      document.getElementById("dash-sub").textContent = `Signed in as ${user.name}`;

      const posts = await fetchPosts();
      const myPosts = posts.filter((p) => p.authorId === user.id);
      const list = document.getElementById("dash-post-list");

      if (myPosts.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            You haven't written anything yet. <a href="create-blog.html">Create your first post</a>.
          </div>
        `;
        return;
      }

      list.innerHTML = myPosts
        .map(
          (p) => `
        <div class="post-row" data-row-id="${p.id}">
          <div>
            <p class="post-row-title">${escapeHtml(p.title)}</p>
            <p class="post-row-meta">${escapeHtml(p.category || "General")} · ${formatDate(p.createdAt)}</p>
          </div>
          <div class="post-row-actions">
            <button class="btn btn-outline btn-view" data-id="${p.id}">View</button>
            <button class="btn btn-outline btn-edit" data-id="${p.id}">Edit</button>
            <button class="btn btn-danger btn-delete" data-id="${p.id}">Delete</button>
          </div>
        </div>
      `
        )
        .join("");

      list.querySelectorAll(".btn-view").forEach((btn) => {
        btn.addEventListener("click", () => {
          const post = getPostById(btn.dataset.id);
          if (post) alert(post.title + "\n\n" + post.content);
        });
      });

      list.querySelectorAll(".btn-edit").forEach((btn) => {
        btn.addEventListener("click", () => {
          window.location.href = `create-blog.html?editId=${encodeURIComponent(btn.dataset.id)}`;
        });
      });

      list.querySelectorAll(".btn-delete").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (confirm("Delete this post? This can't be undone.")) {
            await deletePost(btn.dataset.id);
            renderDashboard();
          }
        });
      });
    }

    renderDashboard();
  </script>
</body>
</html>
