<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inkwell — a small blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="site-nav">
    <div class="container">
      <a href="index.html" class="brand">Ink<span>well</span></a>
      <ul class="nav-links" id="nav-auth-slot">
        <!-- filled by auth.js -->
      </ul>
    </div>
  </nav>

  <header class="hero">
    <div class="container">
      <h1>Short, honest posts on things worth writing down.</h1>
      <p>A small blog built page by page — notes on process, craft, and whatever else is worth keeping.</p>
    </div>
  </header>

  <main class="container">
    <div class="section-heading">
      <h2>Latest posts</h2>
    </div>

    <div class="toolbar" aria-label="Blog filters">
      <input type="search" id="post-search" placeholder="Search posts…" />
      <select id="post-category-filter">
        <option value="All">All categories</option>
        <option>Dev Notes</option>
        <option>Craft</option>
        <option>Life</option>
        <option>Opinion</option>
        <option>Tutorial</option>
      </select>
    </div>

    <div class="post-grid" id="post-grid">
      <!-- filled by app.js -->
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      Inkwell — a frontend development project.
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function refreshHomePosts() {
      const searchInput = document.getElementById("post-search");
      const categoryFilter = document.getElementById("post-category-filter");
      const posts = await fetchPosts({
        search: searchInput ? searchInput.value : "",
        category: categoryFilter ? categoryFilter.value : "All",
      });
      renderHomeGrid("post-grid", { posts, search: searchInput ? searchInput.value : "", category: categoryFilter ? categoryFilter.value : "All" });
    }

    window.addEventListener("DOMContentLoaded", () => {
      const searchInput = document.getElementById("post-search");
      const categoryFilter = document.getElementById("post-category-filter");
      if (searchInput) searchInput.addEventListener("input", refreshHomePosts);
      if (categoryFilter) categoryFilter.addEventListener("change", refreshHomePosts);
      refreshHomePosts();
    });
  </script>
</body>
</html>
