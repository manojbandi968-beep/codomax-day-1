<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — Inkwell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="site-nav">
    <div class="container">
      <a href="index.html" class="brand">Ink<span>well</span></a>
      <ul class="nav-links" id="nav-auth-slot"></ul>
    </div>
  </nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="auth-sub">Takes a minute. No email confirmation needed for this demo.</p>

      <div class="form-error" id="form-error"></div>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required autocomplete="name" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="new-password" minlength="6" />
          <div class="field-hint">At least 6 characters.</div>
        </div>
        <div class="field">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-block">Sign up</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById("register-form");
    const errorBox = document.getElementById("form-error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.remove("show");

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      if (!name) {
        return showError("Enter your name.");
      }
      if (!isValidEmail(email)) {
        return showError("Enter a valid email address.");
      }
      if (password.length < 6) {
        return showError("Password must be at least 6 characters.");
      }
      if (password !== confirmPassword) {
        return showError("Passwords don't match.");
      }

      try {
        const user = await registerUser({ name, email, password });
        setCurrentUser(user);
        window.location.href = "dashboard.html";
      } catch (err) {
        showError(err.message);
      }
    });

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add("show");
    }
  </script>
</body>
</html>
