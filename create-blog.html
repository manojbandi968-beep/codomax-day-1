<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Write a post — Inkwell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="site-nav">
    <div class="container">
      <a href="index.html" class="brand">Ink<span>well</span></a>
      <ul class="nav-links" id="nav-auth-slot"></ul>
    </div>
  </nav>

  <main class="container" style="max-width: 720px;">
    <div class="dash-header">
      <h1 id="post-form-title">Write a new post</h1>
    </div>

    <div class="form-error" id="form-error"></div>

    <form id="create-post-form" novalidate>
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required />
      </div>

      <div class="field">
        <label for="category">Category</label>
        <select id="category" name="category">
          <option>Dev Notes</option>
          <option>Craft</option>
          <option>Life</option>
          <option>Opinion</option>
          <option>Tutorial</option>
        </select>
      </div>

      <div class="field">
        <label for="image-url">Cover image URL (optional)</label>
        <input type="url" id="image-url" name="image-url" placeholder="https://…" />
      </div>

      <div class="field">
        <label for="content">Content</label>
        <textarea id="content" name="content" required placeholder="Write your post…"></textarea>
      </div>

      <button type="submit" id="submit-post-btn" class="btn">Publish</button>
      <a href="dashboard.html" class="btn btn-outline">Cancel</a>
    </form>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    const user = requireAuth();
    const form = document.getElementById("create-post-form");
    const errorBox = document.getElementById("form-error");
    const editId = new URLSearchParams(window.location.search).get("editId");
    const titleInput = document.getElementById("title");
    const categoryInput = document.getElementById("category");
    const imageUrlInput = document.getElementById("image-url");
    const contentInput = document.getElementById("content");
    const submitButton = document.getElementById("submit-post-btn");

    async function hydrateEditForm() {
      if (!editId) return;

      const existing = getPostById(editId);
      const post = existing || await fetch(`${API_BASE}/posts/${editId}`, { headers: getAuthHeaders() }).then((res) => res.ok ? res.json() : null).catch(() => null);

      if (!post) return;

      document.getElementById("post-form-title").textContent = "Edit post";
      submitButton.textContent = "Update post";
      titleInput.value = post.title || "";
      categoryInput.value = post.category || "General";
      imageUrlInput.value = post.imageUrl || "";
      contentInput.value = post.content || "";
    }

    hydrateEditForm();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const title = titleInput.value.trim();
      const category = categoryInput.value;
      const imageUrl = imageUrlInput.value.trim();
      const content = contentInput.value.trim();

      if (!title || !content) {
        errorBox.textContent = "Title and content are required.";
        errorBox.classList.add("show");
        return;
      }

      try {
        if (editId) {
          await updatePost(editId, { title, category, content, imageUrl });
        } else {
          await addPost({
            title,
            category,
            content,
            imageUrl,
            authorId: user.id,
            authorName: user.name,
          });
        }

        window.location.href = "dashboard.html";
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add("show");
      }
    });
  </script>
</body>
</html>
